<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Taproom Screen</title>

<style>
body {
  margin: 0;
  background: #121212;
  font-family: Georgia, serif;
  color: #f5f1e6;
}
.pint {
  position: absolute;
  right: 12px;
  bottom: 10px;
  height: 120px;
  
}
/* existing styles continue below */
/* Chalkboard texture */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://www.transparenttextures.com/patterns/blackboard.png');
  opacity: 0.35;
  z-index: -1;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  height: 100vh;
  gap: 14px;
  padding: 14px;
}

/* Tile */
.tile {
  position: relative;
  background: rgba(0,0,0,0.85);
  border-radius: 10px;
  padding: 18px;
  overflow: hidden;
}

/* Pump */
.pump {
  position: absolute;
  top: 18px;
  left: 18px;
  font-size: 12px;
  opacity: 0.5;
  letter-spacing: 1px;
}

/* Name */
.name {
  font-size: 30px;
  font-weight: bold;
  line-height: 1.1;
  margin-top: 14px;
  margin-bottom: 6px;
}

/* Brewery */
.brewery {
  font-size: 20px;
  opacity: 0.9;
  margin-bottom: 4px;
}

/* ABV */
.abv {
  font-size: 20px;
  opacity: 0.75;
  margin-bottom: 8px;
}

/* Description */
.desc {
  font-size: 16px;
  line-height: 1.35;
  opacity: 0.85;
  max-width: 65%;
}

/* Price */
.price {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 34px;
  font-weight: bold;
  color: #d4af37;
  letter-spacing: 1px;
}

/* Pint */
.pint {
  position: absolute;
  right: 12px;
  bottom: 10px;
  height: 120px;
}

/* Badge */
.badge {
  position: absolute;
  right: 12px;
  top: 12px;
  max-height: 55px;
}

/* Subtle chalk edge */
.tile::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 10px;
  box-shadow: inset 0 0 30px rgba(255,255,255,0.03);
  pointer-events: none;
}
</style>

</head>

<body>

<div class="grid" id="grid"></div>

<script>
const url = "https://opensheet.elk.sh/1G6yyID0GjI7G4T5U_lYQl_WdiYklZ0HaGz9hofafGB4/Screen";

async function loadMenu() {
  const res = await fetch(url);
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  data.sort((a,b) => Number(a.position) - Number(b.position));

  data.forEach(item => {

    grid.innerHTML += `
      <div class="tile"
        style="
          border: ${item.border || '2px solid rgba(255,255,255,0.15)'};
          box-shadow: 0 0 20px ${item.glow || 'transparent'};
        ">

        <div class="pump">PUMP ${item.pump || ""}</div>

        <div class="name" style="color:${item.hex || '#f5f1e6'}">
          ${item.name || ""}
        </div>

        <div class="brewery">
          ${item.brewery || ""}
        </div>

        <div class="abv">
          ${item.abv ? item.abv + '% ABV' : ""}
        </div>

        <div class="desc">
          ${item.description || ""}
        </div>

        <div class="price">
          £${item.price || ""}
        </div>

        ${item.badge_image ? `<img class="badge" src="${item.badge_image}" />` : ""}
        ${item.pint_image ? `<img class="pint" src="${item.pint_image}" />` : ""}

      </div>
    `;
  });
}

loadMenu();
setInterval(loadMenu, 900000);
setInterval(() => location.reload(), 14400000);
</script>

</body>
</html>
