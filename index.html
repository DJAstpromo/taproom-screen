<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Taproom Screen</title>

<style>
body {
  margin: 0;
  background: #1b1b1b;
  font-family: Georgia, serif;
  color: #f5f1e6;
}

/* Chalkboard texture */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
  opacity: 0.3;
  z-index: -1;
}

/* Grid layout */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  height: 100vh;
  gap: 12px;
  padding: 12px;
}

/* Tile */
.tile {
  position: relative;
  background: rgba(0,0,0,0.75);
  border-radius: 12px;
  padding: 16px;
  overflow: hidden;
}

/* Pump number */
.pump {
  position: absolute;
  top: 10px;
  left: 12px;
  font-size: 13px;
  opacity: 0.6;
  letter-spacing: 1px;
}

/* Beer name */
.name {
  font-size: 26px;
  font-weight: bold;
  margin-top: 10px;
}

/* Brewery */
.brewery {
  font-size: 15px;
  opacity: 0.85;
}

/* ABV */
.abv {
  font-size: 13px;
  opacity: 0.75;
  margin-bottom: 6px;
}

/* Description */
.desc {
  font-size: 13px;
  opacity: 0.8;
  line-height: 1.3;
  max-width: 70%;
}

/* Price */
.price {
  position: absolute;
  bottom: 12px;
  left: 16px;
  font-size: 30px;
  font-weight: bold;
  color: #d4af37;
}

/* Pint image */
.pint {
  position: absolute;
  right: 10px;
  bottom: 10px;
  max-height: 130px;
}

/* Badge image */
.badge {
  position: absolute;
  right: 10px;
  top: 10px;
  max-height: 50px;
}
</style>

</head>

<body>

<div class="grid" id="grid"></div>

<script>
const url = "https://opensheet.elk.sh/1G6yyID0GjI7G4T5U_lYQl_WdiYklZ0HaGz9hofafGB4/Screen";

async function loadMenu() {
  const res = await fetch(url);
  const data = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  // Sort by position (important)
  data.sort((a,b) => Number(a.position) - Number(b.position));

  data.forEach(item => {

    grid.innerHTML += `
      <div class="tile"
        style="
          border: ${item.border || '2px solid rgba(255,255,255,0.2)'};
          box-shadow: 0 0 18px ${item.glow || 'transparent'};
        ">

        <div class="pump">Pump ${item.pump || ""}</div>

        <div class="name" style="color:${item.hex || '#f5f1e6'}">
          ${item.name || ""}
        </div>

        <div class="brewery">
          ${item.brewery || ""}
        </div>

        <div class="abv">
          ${item.abv ? item.abv + '% ABV' : ""}
        </div>

        <div class="desc">
          ${item.description || ""}
        </div>

        <div class="price">
          £${item.price || ""}
        </div>

        ${item.badge_image ? `<img class="badge" src="${item.badge_image}" />` : ""}
        ${item.pint_image ? `<img class="pint" src="${item.pint_image}" />` : ""}

      </div>
    `;
  });
}

// Load initially
loadMenu();

// Refresh every 15 minutes
setInterval(loadMenu, 900000);

// Hard refresh every 4 hours (stability)
setInterval(() => location.reload(), 14400000);
</script>

</body>
</html>
