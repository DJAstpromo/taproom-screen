<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Taproom Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Amatic+SC:wght@700&family=Lobster&display=swap" rel="stylesheet">

<style>

/* ===== BODY ===== */
body {
  margin: 0;
  background: #181512;
  font-family: Georgia, serif;
  color: #f5f1e6;
}

/* Chalk texture */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url('https://www.transparenttextures.com/patterns/blackboard.png');
  opacity: 0.25;
  z-index: -1;
}

/* ===== FRAME ===== */
.frame {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background:
    url('https://www.transparenttextures.com/patterns/wood-pattern.png'),
    linear-gradient(135deg, #6b4f2a, #3e2a15);

  box-shadow:
    inset 0 0 80px rgba(0,0,0,0.8),
    inset 0 0 20px rgba(0,0,0,0.6);
}

/* ===== SCREEN ===== */
.screen {
  width: 94%;
  height: 94%;
  display: flex;
  justify-content: center;
  align-items: center;

  background: #121212;
  border-radius: 10px;

  box-shadow:
    inset 0 0 60px rgba(0,0,0,0.9),
    0 0 30px rgba(0,0,0,0.8);
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(4, 1fr);
  width: 96%;
  height: 96%;
  gap: 16px;
}

/* ===== TILE ===== */
.tile {
  position: relative;
  border-radius: 8px;
  padding: 14px;
  overflow: hidden;

  /* chalkboard centre */
  background: rgba(0,0,0,0.88);

  /* depth */
  box-shadow:
    inset 0 0 30px rgba(0,0,0,0.9),
    0 4px 10px rgba(0,0,0,0.6);
}

/* ===== WOOD FRAME AROUND TILE ===== */
.tile::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 8px;

  /* Painted wood effect */
  background:
    url('https://www.transparenttextures.com/patterns/wood-pattern.png'),
    linear-gradient(145deg, var(--tile-color, #7a5a32), var(--tile-color, #4e341a));

  opacity: 0.75; /* Keep it subtle */
  padding: 6px;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;

  pointer-events: none;
}

/* subtle imperfections */
.tile:nth-child(odd) { transform: rotate(-0.3deg); }
.tile:nth-child(even) { transform: rotate(0.3deg); }

/* ===== TEXT ===== */

.pump {
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 4px;
  letter-spacing: 1px;
}

.name {
  font-size: 30px;
  color: #f5f1e6;
  text-shadow:
    0 0 2px rgba(255,255,255,0.4),
    0 0 6px rgba(255,255,255,0.2);
  margin-bottom: 6px;
}

.brewery {
  font-size: 18px;
  opacity: 0.9;
  margin-bottom: 4px;
}

.abv {
  font-size: 16px;
  opacity: 0.7;
  margin-bottom: 6px;
}

.desc {
  font-size: 14px;
  opacity: 0.
